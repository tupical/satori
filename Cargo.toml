[package]
name = "satori"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

# `server/` is a thin, independently-deployed HTTP/MCP wrapper around this lib
# (mirrors the daruma → daruma-server pattern). Boundary-clean: validates a
# platform-issued signed token via a configured key, never references mcpbox.
# This makes satori its own deploy unit.
[workspace]
members = ["server"]

[dependencies]
# Self-contained skeleton: NO daruma-* and NO sibling *_oss deps. Every
# primitive / domain / AI type is local (`ai` re-exports layer-kit's shared,
# zero-heavy-dep AI seam). The concrete AI provider and any daruma adapters
# are supplied by the host via the `AiProvider` trait — implementations
# live only inside the host, never here. layer-kit is shared cross-layer
# infra, not a daruma/sibling-layer dependency.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v7", "serde"] }
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }
once_cell  = "1.20"
toml         = { version = "0.8", default-features = false, features = ["parse"] }
tinytemplate = "1.2"
layer-kit    = { git = "https://github.com/tupical/layer-kit" }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
