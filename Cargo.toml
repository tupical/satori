[package]
name = "sensemaking-oss"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

[dependencies]
# Self-contained skeleton: NO taskagent-* and NO sibling *_oss deps.
# Every primitive / domain / AI type is local. The concrete AI provider
# and any taskagent adapters are supplied by mcpbox via the `AiProvider`
# trait — implementations live only inside mcpbox, never here.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v7", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
once_cell  = "1.20"
toml         = { version = "0.8", default-features = false, features = ["parse"] }
tinytemplate = "1.2"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
